// ---------------------------------------------------------------------------
// Source module: config/modules/01-speedfox.js
// ---------------------------------------------------------------------------
// ============================================================================
// MODULE 01: SPEEDFOX — Gecko GPU, Cache & Network Acceleration
// Goal: Brave-class page-load responsiveness without sacrificing stability.
// Every value here is a supported Gecko/WebRender/Necko knob. Nothing forces
// an unsupported GPU path, keeps the GPU crash-isolation process, and nothing
// disables JavaScript JIT or WebGL.
// ============================================================================

// --- Rendering & Content Layout Pipeline ---
// Fast initial visual paint (5ms avoids flash-of-unstyled-content jank while
// still feeling instantaneous)
defaultPref("nglayout.initialpaint.delay", 5);

// --- WebRender, GPU Compositing & Skia Acceleration ---
// Enable the full GPU-driven WebRender pipeline and pre-cache shaders so the
// first scroll and the first animation never hitch
defaultPref("gfx.webrender.all", true);
defaultPref("gfx.webrender.precache-shaders", true);
defaultPref("gfx.webrender.compositor", true);
// Hardware-accelerated 2D Canvas with a 512 MB VRAM surface cache
defaultPref("gfx.canvas.accelerated", true);
defaultPref("gfx.canvas.accelerated.cache-items", 4096);
defaultPref("gfx.canvas.accelerated.cache-size", 512);
// Expand the Skia glyph raster cache to 20 MB for crisp, zero-stall typography
defaultPref("gfx.content.skia-font-cache-size", 20);
// Keep GPU work inside its own crash-resilient process (never disable: a GPU
// driver crash must not take the browser down)
defaultPref("layers.gpu-process.enabled", true);
// Enable hardware video decode where the platform/GPU actually supports it
defaultPref("media.hardware-video-decoding.enabled", true);
// Reuse decoded images across tabs instead of re-decoding on every navigation
defaultPref("image.mem.shared.unmap.min_expiration_ms", 120000);

// --- RAM-First Caching (Zero Disk Bottleneck + Less SSD Wear) ---
// Disable the slow on-disk HTTP cache; serve hot assets straight from RAM
defaultPref("browser.cache.disk.enable", false);
defaultPref("browser.cache.memory.enable", true);
// 256 MB in-memory media/HTTP cache
defaultPref("browser.cache.memory.capacity", 262144);
defaultPref("browser.cache.memory.max_entry_size", 32768);
// Keep 4 recent pages in the Back/Forward cache for 0ms history navigation
defaultPref("browser.sessionhistory.max_total_viewers", 4);
// Parallelise image decode and enlarge media streaming buffers
defaultPref("image.mem.decode_bytes_at_a_time", 65536);
defaultPref("image.cache.size", 10485760);
defaultPref("media.memory_cache_max_size", 65536);
defaultPref("media.cache_readahead_limit", 7200);
defaultPref("media.cache_resume_threshold", 3600);

// --- HTTP/3 (QUIC), Connection Parallelism & TLS/DNS Speed ---
defaultPref("network.http.http3.enable", true);
// Remove request pacing so a page's assets are fetched as one unpaced burst
defaultPref("network.http.pacing.requests.enabled", false);
// Raise the global connection ceiling and per-host persistent pool
defaultPref("network.http.max-connections", 1800);
defaultPref("network.http.max-persistent-connections-per-server", 10);
defaultPref("network.http.max-urgent-start-excessive-connections-per-host", 5);
// Keep DNS answers and TLS session tickets in cache for far longer
defaultPref("network.dnsCacheEntries", 2000);
defaultPref("network.dnsCacheExpiration", 3600);
defaultPref("network.ssl_tokens_cache_capacity", 10240);

// --- Stability & Memory Pressure Safeguards ---
// Reclaim memory from idle tabs instead of swapping or crashing the browser
defaultPref("browser.tabs.unloadOnLowMemory", true);

// ---------------------------------------------------------------------------
// Source module: config/modules/02-shieldfox.js
// ---------------------------------------------------------------------------
// ============================================================================
// MODULE 02: SHIELDFOX — LibreFox-grade privacy + zero-breakage compatibility
// Goal: eliminate cross-site tracking, telemetry and network leaks while
//       preserving 120Hz+ displays, hardware WebGL/Canvas, dark mode, timezones
//       and normal OAuth/SSO flows.
// Lines tagged `// @lock` are promoted to lockPref() in the AutoConfig and can
// only be changed by editing this module — they are reserved for things that
// transmit data to remote servers.
// ============================================================================

// --- Total Cookie Protection (dFPI) & State Partitioning ---
defaultPref("browser.contentblocking.category", "custom");
// 5 = dynamic first-party isolation: every third-party cookie/storage is
// partitioned by top-level site (SSO and normal logins keep working)
defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("privacy.partition.network_state", true);
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("privacy.trackingprotection.cryptomining.enabled", true);
defaultPref("privacy.trackingprotection.emailtracking.enabled", true);

// --- Balanced Anti-Fingerprinting (preserves 120Hz+, dark mode & WebGL) ---
// Strict RFP stays OFF: it caps the refresh rate at 60Hz, forces light mode,
// spoofs the timezone to UTC and adds Canvas noise that breaks real apps.
defaultPref("privacy.resistFingerprinting", false);
// Granular Firefox Fingerprinting Protection instead (per-category, per-site
// exemptible, and it leaves display refresh rate and timezone intact)
defaultPref("privacy.fingerprintingProtection", true);
// Apply the same granular protection inside private browsing windows
defaultPref("privacy.fingerprintingProtection.pbmode", true);
// Broadcast Global Privacy Control (Sec-GPC: 1) and expose the JS API
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("privacy.globalprivacycontrol.functionality.enabled", true);

// --- URL Tracking-Parameter Stripping (Brave query-filter parity) ---
defaultPref("privacy.query_stripping.enabled", true);
defaultPref("privacy.query_stripping.enabled.pbmode", true);

// --- Prevent Unsolicited Speculative & Analytics Network Leaks ---
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.dns.disablePrefetchFromHTTPS", true);
defaultPref("network.predictor.enabled", false);
defaultPref("network.http.speculative-parallel-limit", 0);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("beacon.enabled", false);
defaultPref("browser.send_pings", false);

// --- HTTPS-Only, CRLite Local Revocation & Encrypted DNS (DoH) ---
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_send_http_background_request", false);
defaultPref("security.ssl.require_safe_negotiation", true);
defaultPref("security.tls.enable_0rtt_data", false);
// Replace live OCSP lookups (slow, and they leak every visited domain) with
// Mozilla's local CRLite binary filters
defaultPref("security.OCSP.enabled", 0);
defaultPref("security.remote_settings.crlite_filters.enabled", true);
defaultPref("security.pki.crlite_mode", 2);
// Mode 2 = prefer encrypted DNS-over-HTTPS through Quad9, with graceful
// fallback so captive portals and LAN-only devices keep working
defaultPref("network.trr.mode", 2);
defaultPref("network.trr.uri", "https://dns.quad9.net/dns-query");

// --- Referer Trimming & WebRTC LAN IP Leak Protection ---
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);
// Only expose ICE candidates for the default route, never the LAN address
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("media.peerconnection.ice.no_host", false);

// --- Zero Telemetry, Studies, Crash Uploads & Ad Attribution ---
// These are the only preferences SheepFox locks in the AutoConfig.
lockPref("datareporting.policy.dataSubmissionEnabled", false); // @lock
lockPref("datareporting.healthreport.uploadEnabled", false); // @lock
lockPref("datareporting.usage.uploadEnabled", false); // @lock
lockPref("toolkit.telemetry.unified", false); // @lock
lockPref("toolkit.telemetry.enabled", false); // @lock
lockPref("toolkit.telemetry.server", "data:,"); // @lock
lockPref("toolkit.telemetry.archive.enabled", false); // @lock
lockPref("toolkit.telemetry.newProfilePing.enabled", false); // @lock
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false); // @lock
lockPref("toolkit.telemetry.updatePing.enabled", false); // @lock
lockPref("toolkit.telemetry.bhrPing.enabled", false); // @lock
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false); // @lock
lockPref("toolkit.coverage.opt-out", true); // @lock
lockPref("toolkit.coverage.endpoint.base", ""); // @lock
lockPref("app.shield.optoutstudies.enabled", false); // @lock
lockPref("app.normandy.enabled", false); // @lock
lockPref("app.normandy.api_url", ""); // @lock
lockPref("breakpad.reportURL", ""); // @lock
lockPref("browser.tabs.crashReporting.sendReport", false); // @lock
lockPref("dom.private-attribution.submission.enabled", false); // @lock

// --- Background Connectivity Pings (disabled, but not locked) ---
defaultPref("captivedetect.canonicalURL", "");
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("network.connectivity-service.enabled", false);
// Keep local Safe Browsing lists active, drop remote binary hash uploads
defaultPref("browser.safebrowsing.downloads.remote.enabled", false);

// ---------------------------------------------------------------------------
// Source module: config/modules/03-cleanfox.js
// ---------------------------------------------------------------------------
// ============================================================================
// MODULE 03: CLEANFOX — Strip telemetry-fed bloat, ads, sponsored tiles & AI
// Goal: minimal RAM footprint, no sponsored content, no background ML workers,
//       and an interface that never nags. `// @lock` is reserved for ad-serving,
//       Pocket and the ML master switch, because those fetch remote content.
// ============================================================================

// --- Disable Background ML / LLM Workers (saves RAM, CPU and battery) ---
lockPref("browser.ml.enable", false); // @lock
defaultPref("browser.ml.chat.enabled", false);
defaultPref("browser.ml.chat.sidebar", false);
defaultPref("browser.ml.chat.shortcuts", false);
defaultPref("browser.ml.linkPreview.enabled", false);
defaultPref("extensions.ml.enabled", false);
defaultPref("extensions.htmlaboutaddons.local_model_management", false);

// --- Remove Pocket, Sponsored Tiles & Mozilla Upsells ---
lockPref("extensions.pocket.enabled", false); // @lock
lockPref("browser.newtabpage.activity-stream.showSponsored", false); // @lock
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false); // @lock
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false); // @lock
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false); // @lock
lockPref("browser.newtabpage.activity-stream.telemetry", false); // @lock
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.default.sites", "");
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.urlbar.quicksuggest.enabled", false);
defaultPref("browser.urlbar.trending.featureGate", false);
defaultPref("browser.urlbar.addons.featureGate", false);
defaultPref("browser.urlbar.mdn.featureGate", false);
defaultPref("browser.urlbar.pocket.featureGate", false);
defaultPref("browser.urlbar.yelp.featureGate", false);
defaultPref("browser.vpn_promo.enabled", false);
defaultPref("browser.promo.focus.enabled", false);
defaultPref("extensions.htmlaboutaddons.recommendations.enabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.aboutConfig.showWarning", false);

// --- UI Customization & Annoyance Blocking ---
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
// Block intrusive notification and geolocation popups by default; a site can
// still earn a per-site grant from the address-bar permission panel
defaultPref("permissions.default.desktop-notification", 2);
defaultPref("permissions.default.geo", 2);

// --- Instant 0ms Fullscreen Transitions (Chromium/Brave parity) ---
defaultPref("full-screen-api.transition-duration.enter", "0 0");
defaultPref("full-screen-api.transition-duration.leave", "0 0");
defaultPref("full-screen-api.warning.timeout", 0);

// ---------------------------------------------------------------------------
// Source module: config/modules/04-smoothfox.js
// ---------------------------------------------------------------------------
// ============================================================================
// MODULE 04: SMOOTHFOX — High-refresh-rate (120Hz/144Hz/240Hz) input physics
// Goal: fluid, low-latency scrolling and Asynchronous Pan/Zoom that samples the
//       real display refresh rate. Nothing here caps the frame rate.
// ============================================================================

// --- Mass-Spring-Damper scroll physics (the 120Hz+ friendly curve) ---
defaultPref("general.smoothScroll", true);
defaultPref("general.smoothScroll.msdPhysics.enabled", true);
defaultPref("general.smoothScroll.msdPhysics.continuousMotionMaxDeltaMS", 12);
defaultPref("general.smoothScroll.msdPhysics.motionBeginSpringConstant", 600);
defaultPref("general.smoothScroll.msdPhysics.regularSpringConstant", 650);
defaultPref("general.smoothScroll.msdPhysics.slowdownMinDeltaMS", 25);
defaultPref("general.smoothScroll.msdPhysics.slowdownSpringConstant", 250);

// --- Wheel feel: one notch covers more ground without feeling floaty ---
defaultPref("mousewheel.default.delta_multiplier_y", 275);

// --- Async Pan/Zoom responsiveness ---
defaultPref("apz.overscroll.enabled", true);
