name: Release Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    name: Windows .exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Zig toolchain
        run: pip install --disable-pip-version-check ziglang pycdlib

      - name: Build and verify the setup executables
        shell: bash
        # Builds both: SheepFox-Setup (Firefox) and SheepFox-Zen-Setup (-Zen baked
        # in). The script refuses to finish if either fails its own PE check.
        run: python mozbuild/scripts/build-installers.py --windows

      - name: Confirm both setups were produced
        shell: bash
        run: |
          ls -l dist
          test -n "$(ls dist/SheepFox-Setup-*.exe)"
          test -n "$(ls dist/SheepFox-Zen-Setup-*.exe)"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: SheepFox-Windows
          path: dist/SheepFox*-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS .dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the ISO writer
        run: python -m pip install --disable-pip-version-check pycdlib

      - name: Build the disk image with hdiutil
        run: python mozbuild/scripts/build-installers.py --macos

      - name: Mount-test the image
        run: |
          dmg="$(ls dist/SheepFox-*.dmg)"
          hdiutil verify "$dmg"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mountpoint" -nobrowse -readonly
          ls -l "$mountpoint"
          test -x "$mountpoint/Install SheepFox.command"
          test -x "$mountpoint/Install SheepFox for Zen.command"
          test -f "$mountpoint/SheepFox/config/user.js"
          hdiutil detach "$mountpoint"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: SheepFox-macOS
          path: dist/SheepFox-*.dmg
          if-no-files-found: error

  fallback:
    name: Portable .iso fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the ISO writer
        run: python -m pip install --disable-pip-version-check pycdlib

      - name: Build the ISO9660 copy of the macOS volume
        run: python3 mozbuild/scripts/build-installers.py --macos

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: SheepFox-ISO
          path: dist/SheepFox-*.iso
          if-no-files-found: error

  extension:
    name: Floating URL Bar .xpi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the manifest and package the extension
        run: |
          python3 mozbuild/scripts/build-extension.py --check
          python3 mozbuild/scripts/build-extension.py
          python3 -c "import glob,json,zipfile; p=glob.glob('dist/SheepFox-Floating-URL-Bar-*.xpi')[0]; z=zipfile.ZipFile(p); m=json.loads(z.read('manifest.json')); assert m['manifest_version']==3 and 'manifest.json' in z.namelist(); print('verified', p)"

      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: SheepFox-Extension
          path: dist/SheepFox-Floating-URL-Bar-*.xpi
          if-no-files-found: error

  publish:
    name: Attach the installers to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, fallback, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: "(SheepFox) Firefox ${{ github.ref_name }}"
          files: |
            artifacts/SheepFox-Setup-*.exe
            artifacts/SheepFox-Zen-Setup-*.exe
            artifacts/SheepFox-*.dmg
            artifacts/SheepFox-*.iso
            artifacts/SheepFox-Floating-URL-Bar-*.xpi
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Drop-in installers for (SheepFox) Firefox and Zen Browser.

            The install writes `user.js` plus **`chrome/userChrome.css`** into every Firefox
            profile it finds: that is the floating Zen/Arc-style search bar on `Ctrl+T` /
            `Ctrl+L`, and it is the only mechanism that can float Firefox's *own* address
            bar. `-NoUI` / `--no-ui` installs everything except that theme.

            Both installers **preinstall uBlock Origin and Decentraleyes** through the
            SheepShields policy (`distribution/policies.json`), and ask for administrator
            rights once because that file lives next to the Firefox binary. Use
            `-ProfileOnly` / `--profile` to skip it and install without admin, or
            `-NoExtensions` / `--no-extensions` to keep the policy but preinstall nothing.

            * **Windows** — `SheepFox-Setup-<version>.exe`. Double-click it. It unpacks
              the payload to `%TEMP%\sheepfox-setup` and runs the same
              `scripts\install-windows.ps1` a git checkout would run, so `-ProfileOnly`,
              `-NoExtensions`, `-System`, `-Strict`, `-LowMemory`, `-NoUI`, `-Uninstall`,
              `-DryRun`, `-Report` and `-Doctor` all work.
              `SheepFox-Setup.exe /?` lists them.
            * **macOS** — `SheepFox-<version>.dmg`. Open it, then double-click
              **Install SheepFox.command**. Gatekeeper may need
              *System Settings -> Privacy & Security -> Open Anyway* for an unsigned
              build; the same `--profile / --no-extensions / --strict / --no-ui /
              --uninstall / --low-memory / --dry-run / --doctor / --report` switches apply.
            * **Fallback** — `SheepFox-<version>.iso`. Identical contents for hosts
              that will not mount the UDIF image.

            Every artifact ships the exact files from `config/`; nothing is
            re-implemented inside the installer.

            ### Zen Browser: same suite, same scripts

            Zen is Firefox underneath, so it takes the same `user.js`. Three
            differences, all deliberate:

            * **`SheepFox-Zen-Setup-<version>.exe`** (or
              `scripts/install-zen.sh` / `scripts/install-zen.bat` /
              `Install SheepFox for Zen.command` on the disk image) targets Zen's
              own folders: `%APPDATA%\zen`, `~/.zen` or `$XDG_CONFIG_HOME/zen`,
              and the Flatpak sandbox. `--browser zen` does the same from
              `install.py`; a plain run installs into every browser it finds.
            * **The floating pill is opt-in there** (`--ui` / `-UI`). Zen already
              ships its own floating omnibox and its own chrome; the numbers,
              the policy and the extensions are unaffected.
            * **A packaged Zen keeps its own policies.** Zen ships
              `distribution/policies.json` with `DisableAppUpdate` and friends.
              SheepFox merges instead of overwriting, and `--uninstall` removes
              only SheepFox's entries - losing `DisableAppUpdate` would let Zen
              update itself behind the package manager.

            On Linux, Zen reads `/etc/zen/policies/policies.json` *instead of*
            the one in its installation folder, and a package upgrade rewrites
            the latter. `--policy-dir /etc/zen/policies` writes there instead.

            ### Floating URL Bar extension (optional)

            `SheepFox-Floating-URL-Bar-<version>.xpi` is the optional WebExtension:
            a floating, Arc/Zen-style address bar on `Ctrl+Shift+Space`. Before you
            type it is a shelf of your bookmarks toolbar - folders open in place with
            a **Back** row, titles wrap, tiles are letter chips whose colour is hashed
            from the host - and as you type it is one list: open tabs, bookmarks,
            history and the web. Clicking outside hides it. It is **not** part of the
            installers - extensions cannot style the browser chrome, and an unsigned
            `.xpi` cannot be installed permanently in release Firefox.

            * Try it now: `about:debugging#/runtime/this-firefox` -> **Load Temporary
              Add-on** -> pick the `.xpi`. It stays until Firefox restarts.
            * Keep it: sign it with your own AMO account
              (`npx web-ext sign --api-key ... --api-secret ...`), then install the
              signed `.xpi` normally.
            * Read `extensions/floating-urlbar/README.md` first: the extension asks
              for history/bookmarks/tabs access, and it never runs on a page you did
              not invoke it on.
